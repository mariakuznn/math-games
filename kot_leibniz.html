/* Layout: arcade cabinet. Pixel-art scene (canvas) on top, terminal panel with the question and answer keys below. Single committed neon-night look. */
:root {
  --night: #0A0912;
  --panel: #14111F;
  --key: #1D1930;
  --line: #2E2848;
  --ink: #EDEAF6;
  --dim: #8A84A3;
  --cyan: #2EE6F0;
  --mag: #FF3DAA;
  --ok: #6BF0A0;
  --f-pixel: "Press Start 2P", ui-monospace, "Courier New", monospace;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { background: var(--night); }
body {
  background: var(--night); color: var(--ink); font: 16px/1.5 var(--f-body);
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.cab { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }
.hud { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.title { font: 14px/1.4 var(--f-pixel); color: var(--cyan); letter-spacing: .04em; text-shadow: 2px 0 var(--mag); }
.chips { display: flex; gap: 6px; }
.hud-r { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.snd { font: 8px/1 var(--f-pixel); color: var(--dim); background: transparent; border: 2px solid var(--line); padding: 7px 8px; cursor: pointer; letter-spacing: .04em; }
.snd[aria-pressed="false"] { color: var(--cyan); border-color: var(--cyan); }
.snd:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.chips i { width: 14px; height: 14px; border: 2px solid var(--line); display: block; }
.chips i.first { background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
.chips i.later { background: var(--mag); border-color: var(--mag); }
.chips i.now { border-color: var(--cyan); }
canvas { width: 100%; aspect-ratio: 16 / 9; max-width: 100%; display: block; image-rendering: pixelated; border: 2px solid var(--line); background: var(--night); }

.panel { background: var(--panel); border: 2px solid var(--line); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.label { font: 10px/1.6 var(--f-pixel); color: var(--mag); letter-spacing: .04em; }
.q { font-size: 22px; min-height: 2.4em; display: flex; align-items: center; justify-content: center; text-align: center; overflow-x: auto; }
.answers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 520px) { .answers { grid-template-columns: minmax(0, 1fr); } }
.ans {
  position: relative; background: var(--key); color: var(--ink); border: 2px solid var(--line); cursor: pointer;
  padding: 14px 10px 12px; font: 19px/1.3 var(--f-body); min-height: 74px; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 0 var(--line); transition: transform .06s, box-shadow .06s, border-color .15s;
}
.ans:hover:not(:disabled) { border-color: var(--cyan); }
.ans:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.ans .k { position: absolute; top: 6px; left: 8px; font: 8px/1 var(--f-pixel); color: var(--dim); }
.ans.wrong { border-color: var(--mag); opacity: .55; }
.ans.right { border-color: var(--ok); box-shadow: 0 4px 0 #1f5a3c; }
.ans:disabled { cursor: default; }
.ans:focus-visible, .btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
.fb { font-size: 15px; padding: 10px 12px; border-left: 3px solid var(--mag); background: var(--key); }
.fb.good { border-left-color: var(--ok); }
.fb b { font-weight: 600; }
.m svg { vertical-align: middle; max-width: 100%; }
.fb .m svg { vertical-align: -0.3em; }
.story { display: grid; gap: 10px; max-width: 62ch; }
.story p { margin: 0; }
.btn {
  justify-self: start; font: 12px/1 var(--f-pixel); color: var(--night); background: var(--cyan); border: 0; cursor: pointer;
  padding: 14px 18px; box-shadow: 0 4px 0 #148a91; letter-spacing: .04em;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #148a91; }
.big { font: 16px/1.5 var(--f-pixel); color: var(--ok); text-shadow: 0 0 10px rgba(107, 240, 160, .5); }
.foot { font: 9px/1.6 var(--f-pixel); color: var(--dim); text-align: right; }
.foot b { color: var(--cyan); font-weight: 400; }
</style>
</head>
<body>

<div class="cab">
  <div class="hud">
    <div class="title">КОТ ЛЕЙБНИЦ</div>
    <div class="hud-r">
      <div class="chips" id="chips" aria-label="Прогресс"></div>
      <button class="snd" id="snd" type="button">ЗВУК: ВКЛ</button>
    </div>
  </div>
  <canvas id="scene" width="640" height="360" aria-label="Пиксельный неоновый город: кот идёт по крышам к энергобарьерам"></canvas>

  <section class="panel" aria-live="polite">
    <div id="intro" class="story">
      <div class="label">// МИССИЯ</div>
      <p>Кот Лейбниц засиделся на крышах неонового города, а дорогу домой перекрыли восемь энергобарьеров. Каждый барьер открывается только верной производной.</p>
      <p>Выбирайте ответ мышкой, пальцем или клавишами 1, 2, 3.</p>
      <button class="btn" id="start">СТАРТ</button>
    </div>

    <div id="ask" hidden>
      <div style="display:grid;gap:14px">
        <div class="label" id="lbl"></div>
        <div class="q" id="q"></div>
        <div class="answers" id="answers"></div>
        <div class="fb" id="fb" hidden></div>
      </div>
    </div>

    <div id="end" class="story" hidden>
      <div class="big">ЛЕЙБНИЦ ДОМА!</div>
      <p id="score"></p>
      <p id="verdict" style="color:var(--dim)"></p>
      <button class="btn" id="again">ЕЩЁ РАЗ</button>
    </div>
    <div class="foot">больше задач: <b>@change_of_variables</b></div>
  </section>
</div>

<script>
(function () {
  // ---------------- questions ----------------
  const Q = [
    { f: String.raw`\left(x^5\right)'`, ok: String.raw`5x^4`, why: String.raw`\((x^n)' = n x^{n-1}\)`,
      bad: [[String.raw`\frac{x^6}{6}`, 'Это первообразная, а нужна производная.'],
            [String.raw`5x^5`, String.raw`Степень уменьшается на единицу: \((x^n)' = n x^{n-1}\).`]] },
    { f: String.raw`\left(\sin 3x\right)'`, ok: String.raw`3\cos 3x`, why: String.raw`Сложная функция: \((\sin 3x)' = \cos 3x \cdot (3x)'\).`,
      bad: [[String.raw`\cos 3x`, String.raw`Забыт множитель \((3x)' = 3\).`],
            [String.raw`-3\cos 3x`, 'Производная синуса — косинус, без минуса.']] },
    { f: String.raw`\left(e^{2x}\right)'`, ok: String.raw`2e^{2x}`, why: String.raw`\((e^{u})' = e^{u}\cdot u'\), здесь \(u' = 2\).`,
      bad: [[String.raw`e^{2x}`, String.raw`Это сложная функция: нужно умножить на \((2x)' = 2\).`],
            [String.raw`2x\,e^{2x-1}`, 'Это правило для степени, а здесь показательная функция.']] },
    { f: String.raw`\left(\ln x\right)'`, ok: String.raw`\frac{1}{x}`, why: 'Табличная производная.',
      bad: [[String.raw`\frac{1}{\ln x}`, String.raw`Табличная формула: \((\ln x)' = \frac{1}{x}\).`],
            [String.raw`x\ln x - x`, 'Это первообразная логарифма.']] },
    { f: String.raw`\left(\sqrt{x}\right)'`, ok: String.raw`\frac{1}{2\sqrt{x}}`, why: String.raw`\(\sqrt{x} = x^{1/2}\), поэтому \(\frac12 x^{-1/2}\).`,
      bad: [[String.raw`\tfrac{2}{3}x^{3/2}`, 'Это первообразная.'],
            [String.raw`\frac{1}{\sqrt{x}}`, String.raw`\(\sqrt{x} = x^{1/2}\): потерян множитель \(\frac12\).`]] },
    { f: String.raw`\left(x^2 e^{x}\right)'`, ok: String.raw`(x^2+2x)\,e^{x}`, why: String.raw`\((uv)' = u'v + uv'\).`,
      bad: [[String.raw`2x\,e^{x}`, String.raw`Производная произведения не равна произведению производных: \((uv)' = u'v + uv'\).`],
            [String.raw`x^2 e^{x}`, String.raw`Потеряно слагаемое \((x^2)'\,e^{x} = 2x\,e^{x}\).`]] },
    { f: String.raw`\left(\cos x^2\right)'`, ok: String.raw`-2x\sin x^2`, why: String.raw`\((\cos u)' = -\sin u\cdot u'\), \(u' = 2x\).`,
      bad: [[String.raw`-\sin x^2`, String.raw`Не забудьте умножить на \((x^2)' = 2x\).`],
            [String.raw`2x\sin x^2`, 'Производная косинуса — минус синус.']] },
    { f: String.raw`\left(\operatorname{tg} x\right)'`, ok: String.raw`\frac{1}{\cos^2 x}`, why: 'Табличная производная.',
      bad: [[String.raw`-\frac{1}{\sin^2 x}`, 'Это производная котангенса.'],
            [String.raw`\operatorname{ctg} x`, String.raw`Табличная формула: \((\operatorname{tg} x)' = \frac{1}{\cos^2 x}\).`]] }
  ];
  const N = Q.length;


  // ---------------- sound: chiptune made in the browser (WebAudio), no files ----------------
  const A = (() => {
    let ctx = null, master = null, music = null, timer = null, nextT = 0, step = 0, muted = false;
    try { muted = localStorage.getItem('leibniz-muted') === '1'; } catch (e) {}
    const BPM = 112, S16 = 60 / BPM / 4;
    const CH = [[45, 48, 52], [41, 45, 48], [48, 52, 55], [43, 47, 50]]; // Am F C G
    const hz = m => 440 * Math.pow(2, (m - 69) / 12);
    function tone(type, freq, t, dur, vol, dest, slideTo) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.03);
    }
    function schedule() {
      while (nextT < ctx.currentTime + 0.12) {
        const ch = CH[Math.floor(step / 16) % 4], s = step % 16;
        if (s % 2 === 0) tone('triangle', hz(ch[0] - 12 + (s % 4 === 2 ? 12 : 0)), nextT, S16 * 1.8, 0.22, music);
        tone('square', hz(ch[[0, 1, 2, 1][s % 4]] + 24), nextT, S16 * 0.9, 0.03, music);
        if (s === 0 || s === 8) tone('sine', 120, nextT, 0.14, 0.32, music, 40);
        nextT += S16; step++;
      }
    }
    return {
      start() {
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
          ctx = new AC(); master = ctx.createGain(); master.gain.value = muted ? 0 : 0.8; master.connect(ctx.destination);
          music = ctx.createGain(); music.gain.value = 0.6; music.connect(master);
        }
        if (ctx.resume) ctx.resume();
        if (!timer) { nextT = ctx.currentTime + 0.05; timer = setInterval(schedule, 25); }
      },
      sfx(kind) {
        if (!ctx) return; const t = ctx.currentTime + 0.01;
        if (kind === 'ok') [72, 76, 79, 84].forEach((m, i) => tone('square', hz(m), t + i * 0.06, 0.12, 0.12, master));
        else if (kind === 'bad') tone('sawtooth', 220, t, 0.3, 0.12, master, 80);
        else if (kind === 'win') [72, 76, 79, 84, 88, 91].forEach((m, i) => tone('square', hz(m), t + i * 0.1, i === 5 ? 0.6 : 0.16, 0.12, master));
      },
      toggle() {
        muted = !muted; try { localStorage.setItem('leibniz-muted', muted ? '1' : '0'); } catch (e) {}
        if (master) master.gain.setTargetAtTime(muted ? 0 : 0.8, ctx.currentTime, 0.02);
      },
      get muted() { return muted; }
    };
  })();

  const esc = t => t.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const M = tex => TEXMAP[tex] ? `<span class="m">${TEXMAP[tex]}</span>` : `<code>${esc(tex)}</code>`;
  const rich = s => s.replace(/\\\((.+?)\\\)/g, (_, t) => M(t));
  const typeset = () => {};
  const chips = $('chips');
  for (let i = 0; i < N; i++) chips.appendChild(document.createElement('i'));
  function paintChips() {
    [...chips.children].forEach((c, i) => {
      c.className = S.result[i] === 1 ? 'first' : S.result[i] === 2 ? 'later' : i === S.gate && S.mode !== 'intro' ? 'now' : '';
    });
  }

  // ---------------- world ----------------
  const GROUND = 150, PX = 2;
  const G = i => 230 + i * 180;               // gate positions
  const HOME = G(N - 1) + 200;
  const STOP = i => G(i) - 40;                 // where the cat waits
  const S = { mode: 'intro', catX: 60, target: 60, gate: 0, mistakes: 0, result: [], order: [], bonk: 0, flash: 0, t: 0, frame: 0, opened: [] };

  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function makeLayer(seed, span, wMin, wMax, hMin, hMax, signs) {
    const r = rng(seed), out = []; let x = 0;
    while (x < span) {
      const w = wMin + r() * (wMax - wMin), h = hMin + r() * (hMax - hMin), win = [];
      for (let wy = GROUND - h + 6; wy < GROUND - 6; wy += 7)
        for (let wx = x + 4; wx < x + w - 5; wx += 6) if (r() < 0.22) win.push([wx, wy, r() < 0.5 ? '#1f7f8c' : r() < 0.6 ? '#8a2a68' : '#8c6d2a']);
      const sign = signs && r() < 0.35 ? { x: x + w / 2 - 9, y: GROUND - h + 5, c: r() < 0.5 ? '#2EE6F0' : '#FF3DAA' } : null;
      out.push({ x, w, h, win, sign }); x += w + 2 + r() * 8;
    }
    return { list: out, span: x };
  }
  const FAR = makeLayer(11, 900, 26, 60, 50, 110, false);
  const NEAR = makeLayer(29, 1100, 40, 90, 22, 60, true);
  const stars = (() => { const r = rng(5); return Array.from({ length: 70 }, () => [r() * 320, r() * 95, r() < 0.2 ? 2 : 1]); })();
  const rain = (() => { const r = rng(8); return Array.from({ length: 70 }, () => ({ x: r() * 330, y: r() * 180, s: 140 + r() * 80, l: 4 + r() * 5 })); })();

  // cat sprite (original pixel cat), facing right; 16 x 11
  const CAT_TOP = [
    '..........b...b.',
    '..........bb.bb.',
    '..........bbbbb.',
    't.........bebeb.',
    't.........bbbbbn',
    '.t.bbbbbbbcbbb..',
    '.tbbbbbbbbbbb...',
    '..bbbbbbbbbbb...',
    '..bbbbbbbbbbb...'];
  const LEGS = [['..b.b.....b.b...', '..b.b.....b.b...'], ['...b.b...b.b....', '...b.b...b.b....']];
  const CAT_COL = { b: '#3B3556', t: '#3B3556', e: '#2EE6F0', n: '#FF8FC8', c: '#FF3DAA' };

  const cv = $('scene'), g = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function drawCat(x, y, frame) {
    const rows = CAT_TOP.concat(LEGS[frame]);
    // rim light so the dark cat reads against the night
    g.fillStyle = 'rgba(46,230,240,0.18)';
    rows.forEach((row, j) => { for (let i = 0; i < row.length; i++) if (row[i] !== '.') g.fillRect(x + i * PX - 1, y + j * PX - 1, PX + 2, PX + 2); });
    rows.forEach((row, j) => { for (let i = 0; i < row.length; i++) { const c = CAT_COL[row[i]]; if (c) { g.fillStyle = c; g.fillRect(x + i * PX, y + j * PX, PX, PX); } } });
  }

  function drawLayer(L, off, fill) {
    const start = Math.floor(off / L.span) * L.span;
    for (let base = start; base < off + 330; base += L.span) {
      for (const b of L.list) {
        const sx = Math.round(base + b.x - off);
        if (sx > 320 || sx + b.w < 0) continue;
        g.fillStyle = fill; g.fillRect(sx, GROUND - b.h, Math.ceil(b.w), b.h);
        for (const [wx, wy, c] of b.win) { g.fillStyle = c; g.fillRect(Math.round(base + wx - off), Math.round(wy), 2, 2); }
        if (b.sign) {
          const blink = (Math.sin(S.t * 3 + b.x) > -0.85) ? 1 : 0.3;
          g.save(); g.shadowColor = b.sign.c; g.shadowBlur = 6; g.globalAlpha = blink;
          g.fillStyle = b.sign.c; g.fillRect(Math.round(base + b.sign.x - off), Math.round(b.sign.y), 18, 3); g.restore();
        }
      }
    }
  }

  function pixText(txt, x, y, color, size = 8) {
    g.font = size + 'px "Press Start 2P", monospace'; g.textAlign = 'center'; g.fillStyle = color; g.fillText(txt, x, y);
  }

  function drawGate(i, cam) {
    const x = Math.round(G(i) - cam);
    if (x < -40 || x > 360) return;
    const open = S.opened[i] !== undefined, active = i === S.gate && !open;
    g.fillStyle = '#4a4466'; g.fillRect(x, 104, 4, 46); g.fillRect(x + 22, 104, 4, 46); g.fillRect(x - 1, 101, 28, 4);
    if (!open) {
      const red = active && S.flash > 0;
      const col = red ? '#FF3DAA' : '#2EE6F0';
      g.save(); g.shadowColor = col; g.shadowBlur = 8;
      for (const lx of [7, 12, 17]) {
        g.globalAlpha = 0.65 + 0.35 * Math.sin(S.t * 20 + lx + i);
        g.fillStyle = col; g.fillRect(x + lx, 106, 2, 44);
      }
      g.restore();
    } else {
      const k = Math.min(1, (S.t - S.opened[i]) / 0.4);
      if (k < 1) { g.save(); g.globalAlpha = 1 - k; g.fillStyle = '#6BF0A0'; for (const lx of [7, 12, 17]) g.fillRect(x + lx, 106, 2, 44); g.restore(); }
    }
    g.fillStyle = open ? '#6BF0A0' : '#2EE6F0'; g.fillRect(x + 1, 102, 3, 2); g.fillRect(x + 22, 102, 3, 2);
    pixText(String(i + 1), x + 13, 96, open ? '#6BF0A0' : active ? '#2EE6F0' : '#5d577a');
  }

  function drawHome(cam) {
    const x = Math.round(HOME - cam);
    if (x > 340) return;
    g.fillStyle = '#231c3c'; g.fillRect(x, 92, 76, 58);
    g.fillStyle = '#2e2650'; g.fillRect(x - 4, 88, 84, 5);
    g.save(); g.shadowColor = '#F2B544'; g.shadowBlur = 10; g.fillStyle = '#F2B544'; g.fillRect(x + 46, 106, 16, 13); g.restore();
    g.fillStyle = '#231c3c'; g.fillRect(x + 53, 106, 2, 13); g.fillRect(x + 46, 112, 16, 1);
    g.fillStyle = '#120e22'; g.fillRect(x + 12, 118, 16, 32);
    g.save(); g.shadowColor = '#FF3DAA'; g.shadowBlur = 8; pixText('ДОМ', x + 38, 82, '#FF3DAA'); g.restore();
  }

  function draw() {
    g.setTransform(2, 0, 0, 2, 0, 0);
    const cam = Math.max(0, S.catX - 90);
    const sky = g.createLinearGradient(0, 0, 0, GROUND);
    sky.addColorStop(0, '#07060d'); sky.addColorStop(1, '#1d1236');
    g.fillStyle = sky; g.fillRect(0, 0, 320, 180);
    for (const [sx, sy, s] of stars) { g.fillStyle = 'rgba(255,255,255,0.55)'; g.fillRect(Math.round(((sx - cam * 0.03) % 320 + 320) % 320), sy, s === 2 ? 1 : 1, 1); }
    g.save(); g.shadowColor = '#d9d2ff'; g.shadowBlur = 14; g.fillStyle = '#e6e0ff';
    g.beginPath(); g.arc(262, 34, 11, 0, Math.PI * 2); g.fill(); g.restore();
    g.fillStyle = '#1d1236'; g.beginPath(); g.arc(268, 30, 10, 0, Math.PI * 2); g.fill();
    drawLayer(FAR, cam * 0.25, '#130f25');
    drawLayer(NEAR, cam * 0.55, '#0c0a18');
    // rooftop
    g.fillStyle = '#16122a'; g.fillRect(0, GROUND, 320, 30);
    g.save(); g.shadowColor = '#FF3DAA'; g.shadowBlur = 6; g.fillStyle = '#FF3DAA'; g.fillRect(0, GROUND, 320, 1); g.restore();
    for (let k = Math.floor(cam / 70) - 1; k < cam / 70 + 6; k++) {
      const vx = Math.round(k * 70 + 30 - cam);
      g.fillStyle = '#221c3a'; g.fillRect(vx, GROUND + 6, 10, 4); g.fillRect(vx + 2, GROUND + 10, 2, 8);
    }
    for (let i = 0; i < N; i++) drawGate(i, cam);
    drawHome(cam);
    // cat
    const hop = S.bonk > 0 ? Math.sin(Math.PI * (1 - S.bonk / 0.45)) * 10 : 0;
    const back = S.bonk > 0 ? (1 - S.bonk / 0.45) * -6 : 0;
    const walking = S.catX < S.target - 0.5;
    drawCat(Math.round(S.catX - cam + back), Math.round(GROUND - 11 * PX - hop), walking ? S.frame : 0);
    if (S.mode === 'done') pixText('мрр!', Math.round(S.catX - cam + 20), GROUND - 30, '#F2B544', 8);
    // rain
    g.strokeStyle = 'rgba(150,180,255,0.22)'; g.lineWidth = 1; g.beginPath();
    for (const d of rain) { g.moveTo(d.x, d.y); g.lineTo(d.x - 1.5, d.y + d.l); }
    g.stroke();
  }

  // ---------------- flow ----------------
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function showQuestion() {
    const q = Q[S.gate];
    $('intro').hidden = true; $('end').hidden = true; $('ask').hidden = false;
    $('lbl').textContent = `// БАРЬЕР ${S.gate + 1}/${N} · НАЙДИТЕ ПРОИЗВОДНУЮ`;
    $('q').innerHTML = M(`\\displaystyle ${q.f} = \\;?`);
    const opts = shuffle([{ tex: q.ok, ok: true }, ...q.bad.map(([tex, hint]) => ({ tex, hint }))]);
    const box = $('answers'); box.innerHTML = '';
    opts.forEach((o, k) => {
      const b = document.createElement('button'); b.className = 'ans'; b.type = 'button'; b.id = 'ans' + k;
      b.innerHTML = `<span class="k">${k + 1}</span>` + M(`\\displaystyle ${o.tex}`);
      b.dataset.ok = o.ok ? '1' : '0';
      b.onclick = () => choose(b, o);
      box.appendChild(b);
    });
    $('fb').hidden = true; S.mistakes = 0; S.mode = 'ask';
    paintChips(); typeset($('ask'));
  }

  function choose(btn, o) {
    if (S.mode !== 'ask' || btn.disabled) return;
    const fb = $('fb');
    if (o.ok) {
      btn.classList.add('right');
      [...$('answers').children].forEach(b => b.disabled = true);
      S.result[S.gate] = S.mistakes === 0 ? 1 : 2;
      fb.className = 'fb good'; fb.innerHTML = `<b>Барьер открыт.</b> ${rich(Q[S.gate].why)}`; fb.hidden = false; typeset(fb);
      S.opened[S.gate] = S.t; S.gate++; A.sfx('ok');
      S.target = S.gate < N ? STOP(S.gate) : HOME + 2;
      S.mode = 'walk'; paintChips();
    } else {
      S.mistakes++; btn.classList.add('wrong'); btn.disabled = true;
      fb.className = 'fb'; fb.innerHTML = `<b>Барьер не поддался.</b> ${rich(o.hint)}`; fb.hidden = false; typeset(fb);
      S.bonk = 0.45; S.flash = 0.5; A.sfx('bad');
    }
  }

  function finish() {
    A.sfx('win');
    S.mode = 'done';
    $('ask').hidden = true; $('end').hidden = false;
    const first = S.result.filter(v => v === 1).length;
    $('score').textContent = `С первой попытки: ${first} из ${N}.`;
    $('verdict').textContent = first === N ? 'Безупречно. Таблица производных у вас в лапах.'
      : first >= 6 ? 'Отлично! Посмотрите ещё раз барьеры, отмеченные розовым.'
      : 'Розовые квадратики наверху — барьеры с ошибками. Повторите правила для них и пройдите ещё раз.';
    paintChips();
  }

  function start() {
    A.start();
    Object.assign(S, { mode: 'walk', catX: 60, gate: 0, result: [], opened: [], bonk: 0, flash: 0 });
    S.target = STOP(0);
    $('intro').hidden = true; $('end').hidden = true; $('ask').hidden = true; $('fb').hidden = true;
    paintChips();
  }
  $('start').onclick = start;
  $('again').onclick = start;
  const snd = $('snd');
  function paintSnd() { snd.textContent = A.muted ? 'ЗВУК: ВЫКЛ' : 'ЗВУК: ВКЛ'; snd.setAttribute('aria-pressed', A.muted ? 'true' : 'false'); }
  snd.onclick = () => { A.toggle(); paintSnd(); };
  paintSnd();
  addEventListener('keydown', e => {
    if (S.mode === 'intro' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); start(); return; }
    const k = +e.key; if (S.mode === 'ask' && k >= 1 && k <= 3) { const b = $('ans' + (k - 1)); if (b) b.click(); }
  });

  // ---------------- loop ----------------
  let last = performance.now(), acc = 0;
  function tick(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now; S.t += dt;
    if (S.catX < S.target) {
      S.catX = Math.min(S.target, S.catX + (reduce ? 2000 : 75) * dt);
      acc += dt; if (acc > 0.14) { acc = 0; S.frame ^= 1; }
      if (S.catX >= S.target) { if (S.mode === 'walk') (S.gate < N ? showQuestion() : finish()); }
    }
    S.bonk = Math.max(0, S.bonk - dt); S.flash = Math.max(0, S.flash - dt);
    if (!reduce) for (const d of rain) { d.y += d.s * dt; d.x -= d.s * dt * 0.15; if (d.y > 180) { d.y = -8; d.x = Math.random() * 340; } }
    draw();
    requestAnimationFrame(tick);
  }
  paintChips();
  if (document.fonts) document.fonts.ready.then(draw);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
