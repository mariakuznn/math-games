<script>
(() => {

  step: () => tone(85, 0.09, { f1: 50, vol: 0.12 }),
  door: () => { tone(95, 0.7, { type: "triangle", f1: 52, vol: 0.22 }); tone(150, 0.45, { f1: 80, vol: 0.08, delay: 0.05 }); },

  bad: () => tone(150, 0.3, { type: "triangle", f1: 118, vol: 0.12 }),
  hit: () => { tone(70, 0.6, { type: "triangle", f1: 40, vol: 0.3 }); tone(110, 0.4, { f1: 60, vol: 0.12 }); },
  tick: () => tone(1400, 0.05, { vol: 0.035 }),
  win: () => [523.3, 659.3, 784, 1046.5].forEach((f, i) => tone(f, 0.9, { vol: 0.07, delay: i * 0.14 }))
};

// ---------- three.js scene ----------
const L = 12, ROOMS = 10, WID = 8, HGT = 5, TOTAL = (ROOMS + 1) * L;
const renderer = new THREE.WebGLRenderer({ canvas: $("gl"), antialias: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2) * 0.5);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070b);

const camera = new THREE.PerspectiveCamera(70, 1, 0.05, 80);
scene.add(camera);
const flashlight = new THREE.PointLight(0xfff0d8, 0.55, 7, 2); camera.add(flashlight);
scene.add(new THREE.AmbientLight(0x3a4254, 0.55));
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w / h < 0.8 ? 82 : 70; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

// pixel textures
function tex(w, h, draw) {

  const t = new THREE.CanvasTexture(c); t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;

const P = (g, x, y, r, gg, b) => { g.fillStyle = `rgb(${r | 0},${gg | 0},${b | 0})`; g.fillRect(x, y, 1, 1); };

  stone: tex(16, 16, (g) => { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const row = y >> 2, mort = y % 4 === 3 || (x + (row % 2) * 4) % 8 === 7, k = 0.82 + 0.3 * rnd();
    mort ? P(g, x, y, 34, 36, 42) : P(g, x, y, 82 * k, 86 * k, 96 * k); } }),
  planks: tex(16, 16, (g) => { const base = [[118, 82, 46], [104, 72, 40], [126, 88, 50], [98, 68, 38]];
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const b = base[y >> 2], k = 0.85 + 0.22 * rnd(), seam = y % 4 === 3 || (x === ((y >> 2) * 5 + 3) % 16);
      seam ? P(g, x, y, 44, 30, 18) : P(g, x, y, b[0] * k, b[1] * k, b[2] * k); } }),
  ceil: tex(16, 16, (g) => { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const k = 0.85 + 0.2 * rnd(); x % 4 === 3 ? P(g, x, y, 18, 14, 10) : P(g, x, y, 52 * k, 38 * k, 26 * k); } }),
  door: tex(16, 32, (g) => { for (let y = 0; y < 32; y++) for (let x = 0; x < 16; x++) { const k = 0.85 + 0.22 * rnd(), band = (y >= 5 && y <= 6) || (y >= 25 && y <= 26), edge = x === 0 || x === 15 || y === 0 || y === 31;

  ward: tex(16, 32, (g) => { for (let y = 0; y < 32; y++) for (let x = 0; x < 16; x++) { const k = 0.85 + 0.2 * rnd(), edge = x === 0 || x === 15 || y === 0 || y === 31 || x === 7 || x === 8, slat = y > 3 && y < 14 && y % 2 === 0;

    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const k = 0.85 + 0.2 * rnd(); if (y === 0 || y === 7 || y === 8 || y === 15 || x === 0 || x === 15) P(g, x, y, 96 * k, 66 * k, 36 * k); else P(g, x, y, 20, 14, 10); }
    for (const [y0, y1] of [[1, 6], [9, 14]]) { let x = 1; while (x < 15) { const w = 1 + (rnd() < 0.5 ? 1 : 0), c = cols[Math.floor(rnd() * cols.length)], top = y0 + Math.floor(rnd() * 2);

const rep = (t, rx, ry) => { const c = t.clone(); c.needsUpdate = true; c.repeat.set(rx, ry); return c; };

// corridor shell
{
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(WID, TOTAL + 2), lam(rep(T.planks, WID, TOTAL + 2)));
  floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0, -TOTAL / 2 + 1); scene.add(floor);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(WID, TOTAL + 2), lam(rep(T.ceil, WID, TOTAL + 2)));
  ceil.rotation.x = Math.PI / 2; ceil.position.set(0, HGT, -TOTAL / 2 + 1); scene.add(ceil);
  for (const s of [-1, 1]) {
    const w = new THREE.Mesh(new THREE.PlaneGeometry(TOTAL + 2, HGT), lam(rep(T.stone, TOTAL + 2, HGT)));
    w.rotation.y = -s * Math.PI / 2; w.position.set(s * WID / 2, HGT / 2, -TOTAL / 2 + 1); scene.add(w);
  }
  const back = new THREE.Mesh(new THREE.PlaneGeometry(WID, HGT), lam(rep(T.stone, WID, HGT)));
  back.rotation.y = Math.PI; back.position.set(0, HGT / 2, 1); scene.add(back);
  // end wall with the exit door; daylight sits behind the doorway
  const sm = lam(rep(T.stone, 3, HGT)), tm = lam(rep(T.stone, 2, 2));
  for (const s of [-1, 1]) { const seg = new THREE.Mesh(new THREE.BoxGeometry(3, HGT, 0.5), sm); seg.position.set(s * 2.5, HGT / 2, -TOTAL); scene.add(seg); }
  const top = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 0.5), tm); top.position.set(0, 4, -TOTAL); scene.add(top);
  const day = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 3.4), new THREE.MeshBasicMaterial({ color: 0xf2f6f8, fog: false }));
  day.position.set(0, 1.6, -TOTAL - 0.4); scene.add(day);
}
// door walls, doors, plates
const DIG = ["111101101101111", "010110010010111", "111001111100111", "111001111001111", "101101111001001", "111100111001111", "111100111101111", "111001010010010", "111101111101111", "111101111001111"];

const doors = [];

  const z = -k * L, sm = lam(rep(T.stone, 3, HGT)), tm = lam(rep(T.stone, 2, 2));

  const m = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.18, 0.7), new THREE.MeshBasicMaterial({ color: 0xffcf86 }));

}
const roomLights = [0, 1, 2].map(() => { const l = new THREE.PointLight(0xffc27a, 1.15, 15, 2); scene.add(l); return l; });
const exitLight = new THREE.PointLight(0xe8f0ff, 0, 22, 2); exitLight.position.set(0, 2, -TOTAL + 1.2); scene.add(exitLight);
const exitDoor = new THREE.Group(); exitDoor.position.set(-1, 0, -TOTAL); scene.add(exitDoor);

    await wait(0.5); $("slats").style.opacity = "0";
    const x0 = cam.x, z0 = cam.z, y0 = cam.yaw;
    await anim(0.8, u => { const e = ease(u); cam.x = x0 * (1 - e); cam.z = z0 + (camZ - z0) * e; cam.yaw = y0 * (1 - e); });
    banner("ГУЛ ПРОШЁЛ МИМО", false, 2000);
  } else {
    S.battery--; hud();
    banner(`ГУЛ ЗАДЕЛ ТЕБЯ. ВЕРНО: ${r.item.o[0].replace(/<[^>]+>/g, m => m === "<sup>" ? "^" : "")}`, true, 3600);
    if (S.battery <= 0) { await wait(1.2); return gameOver(); }
  }
  S.humDone[k] = true; S.busy = false;
  return true;
}
async function gameOver() {
  S.phase = "over";
  await new Promise(res => {
    open(`
      <div class="eyebrow">КОМНАТА ${pad3(S.room)}</div>
      <h2>Фонарь погас</h2>
      <p>Гул догнал тебя в темноте. Двери, которые ты уже открыл, остаются открытыми.</p>
      <div class="row"><button class="go" id="again">ПОПРОБОВАТЬ СНОВА</button></div>`);
    $("again").addEventListener("click", () => { close(); res(); });
  });
  S.battery = 3; S.humDone[S.room] = false; hud();
  cam.x = 0; cam.yaw = 0; cam.z = -S.room * L - 1.5; S.busy = false; S.phase = "play";
  showAct("ИДТИ К ДВЕРИ", goToDoor);
  return false;
}

// ---------- flow ----------
async function goToDoor() {
  const k = S.room;
  if (EVENT_ROOMS.includes(k) && !S.humDone[k]) {
    await walk(-k * L - L / 2 + 0.3);
    const ok = await humEvent();
    if (ok === false) return;
  }
  await walk(-(k + 1) * L + 2.3);
  await doorTask(k + 1);
  sfx.door();
  const d = doors[k];
  await anim(1.0, u => { d.rotation.y = 1.75 * ease(u); });
  S.room = k + 1; placeLights(S.room); hud();
  if (S.room >= ROOMS) return finale();
  await walk(-S.room * L - 1.5);
  if (S.room === 1) banner("ДАЛЬШЕ ТЕМНЕЕ", false, 1800);
  showAct(`ИДТИ К ДВЕРИ ${String(S.room + 1).padStart(4, "0")}`, goToDoor);
}
async function finale() {
  await walk(-TOTAL + 2.6, 3.2);
  sfx.door();
  await anim(1.2, u => { const e = ease(u); exitDoor.rotation.y = 1.75 * e; exitLight.intensity = 2.4 * e; });
  await walk(-TOTAL + 1.6, 1.5);
  sfx.win();
  const sec = Math.round((performance.now() - S.start) / 1000);
  open(`
    <div class="eyebrow">ВЫХОД</div>
    <h1>Ты выбрался</h1>
    <p>Все десять замков открыты производными.</p>
    <dl class="stats">
      <dt>ВРЕМЯ</dt><dd>${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}</dd>
      <dt>ДВЕРЕЙ</dt><dd>10 / 10</dd>
      <dt>ОШИБОК В ЗАМКАХ</dt><dd>${S.mistakes}</dd>
      <dt>ГУЛ ПРОШЁЛ МИМО</dt><dd>${S.humSurvived} / ${EVENT_ROOMS.length}</dd>
    </dl>
    <div class="row"><button class="go" id="again">ПРОЙТИ СНОВА</button></div>`);
  $("again").addEventListener("click", () => location.reload());
}
function title() {
  open(`
    <div class="eyebrow">АРХИВ УТОПИИ</div>
    <h1>Десять дверей</h1>
    <p>Ты в заброшенном архиве. Каждую дверь держит замок, и открывает его только правильная частная производная или градиент.</p>
    <p>Иногда по коридору проходит Гул. Когда свет мигает, ответь быстро и спрячься в шкаф.</p>
    <p class="keys">Пробел или кнопка внизу — идти. Мышь — осмотреться. Возьми бумагу и ручку.</p>
    <div class="row"><button class="go" id="go">ВОЙТИ</button></div>`);
  $("go").addEventListener("click", () => { audioInit(); close(); S.phase = "play"; S.start = performance.now(); $("snd").hidden = false; hud(); banner("КОМНАТА 000", false, 1600); showAct("ИДТИ К ДВЕРИ 0001", goToDoor); });
}

placeLights(0); hud();
requestAnimationFrame(frame);
title();
})();
</script>
